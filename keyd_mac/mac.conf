include ru

[global]
default_layout = en

# English layout (main mappings would override the ru layout)
[en:layout]
` = ~
capslock = esc

# ru is a layer above [main] and the en layout: undo the en remaps, fix what emits US keycodes.
# Caps Lock in ru switches to en (e.g. before typing the lock-screen password)
[ru]
capslock = togglem(ru, C-leftmeta)
` = `
d+f = macro(C-leftmeta S-[ C-compose)
j+k = macro(C-leftmeta S-] C-compose)
j+enter = macro(C-leftmeta escape S-a ; escape C-compose)
k+enter = macro(C-leftmeta escape S-a , escape C-compose)

[main]
rightmeta = layer(symbols)

d+f = {
j+k = }
p+o = macro(( ) left)
c+v = macro(C-/)
j+enter = macro(escape S-a ; escape)
k+enter = macro(escape S-a , escape)

[symbols]
` = ~

tab = ~
q = '
w = =
e = {
r = }
t = "
y = ~
u = _
i = |
o = \
p = +
backspace = backspace

capslock = :
a = &
s = /
d = (
f = )
g = @
h = #
j = $
k = !
l = *
enter = ;

z = %
x = ^
c = [
v = ]
b = `
n = -
m = *
, = ,
. = .
/ = ?
rightshift = rightshift

meta = <
alt = >
space = space

1 = !
2 = @
3 = #
4 = $
5 = %

leftcontrol = \

# Symbols layer in ru: symbols the ru layout has are sent natively, the rest
# switch to us for one key and back.
[ru+symbols]
` = macro(C-leftmeta S-` C-compose)
tab = macro(C-leftmeta S-` C-compose)
q = macro(C-leftmeta ' C-compose)
e = macro(C-leftmeta S-[ C-compose)
r = macro(C-leftmeta S-] C-compose)
t = S-2
y = macro(C-leftmeta S-` C-compose)
i = macro(C-leftmeta S-\ C-compose)

capslock = S-6
a = macro(C-leftmeta S-7 C-compose)
s = S-\
g = macro(C-leftmeta S-2 C-compose)
h = macro(C-leftmeta S-3 C-compose)
j = macro(C-leftmeta S-4 C-compose)
enter = S-4

x = macro(C-leftmeta S-6 C-compose)
c = macro(C-leftmeta [ C-compose)
v = macro(C-leftmeta ] C-compose)
b = macro(C-leftmeta ` C-compose)
, = S-/
. = /
/ = S-7

meta = macro(C-leftmeta S-, C-compose)
alt = macro(C-leftmeta S-. C-compose)

2 = macro(C-leftmeta S-2 C-compose)
3 = macro(C-leftmeta S-3 C-compose)
4 = macro(C-leftmeta S-4 C-compose)
